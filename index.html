<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>iPhone 16</title>

  <script type="module"
    src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: white;
      overflow: hidden;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      background: white;
    }
  </style>
</head>

<body>

  <model-viewer
    src="./iphone16.glb"
    camera-controls
    auto-rotate
    shadow-intensity="0.15"
    exposure="1"
    camera-orbit="0deg 75deg 2.5m"
    field-of-view="35deg">
  </model-viewer>

</body>
</html>
