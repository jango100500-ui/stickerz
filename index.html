<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>iPhone 16</title>

  <script type="module"
    src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
    }

    .scene {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    model-viewer {
      width: 100%;
      height: 70%;
      background: transparent;
    }

    .colors {
      display: flex;
      gap: 16px;
      padding: 13px 17px;

      background: rgba(245, 245, 247, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);

      border-radius: 999px;

      box-shadow:
        0 8px 30px rgba(0, 0, 0, 0.08);
    }

    button {
      appearance: none;
      -webkit-appearance: none;

      width: 28px;
      height: 28px;

      padding: 0;
      border: 2px solid white;
      border-radius: 50%;

      box-shadow:
        0 1px 4px rgba(0, 0, 0, 0.25);

      cursor: pointer;

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    button:active {
      transform: scale(0.9);
    }

    button.active {
      outline: 2px solid #111;
      outline-offset: 3px;
    }

    .black {
      background: #171717;
    }

    .white {
      background: #eeeae2;
    }

    .blue {
      background: #9bb7d2;
    }

    .pink {
      background: #e6b5bd;
    }

    .green {
      background: #a9c2b0;
    }
  </style>
</head>

<body>

  <div class="scene">

    <model-viewer
      id="phone"
      src="./iphone16.glb"

      camera-controls
      auto-rotate
      rotation-per-second="18deg"

      shadow-intensity="0.18"
      exposure="1"

      camera-orbit="0deg 75deg 3.4m"
      field-of-view="32deg">

    </model-viewer>


    <div class="colors">

      <button
        class="color black active"
        data-color="#171717"
        aria-label="Black">
      </button>

      <button
        class="color white"
        data-color="#eeeae2"
        aria-label="White">
      </button>

      <button
        class="color blue"
        data-color="#9bb7d2"
        aria-label="Blue">
      </button>

      <button
        class="color pink"
        data-color="#e6b5bd"
        aria-label="Pink">
      </button>

      <button
        class="color green"
        data-color="#a9c2b0"
        aria-label="Green">
      </button>

    </div>

  </div>


  <script>

    const phone = document.querySelector("#phone");
    const buttons = document.querySelectorAll(".color");

    /*
      Материалы именно из твоего iphone16.glb:

      JtcYDcQFnoAKzhN_001
      → основной корпус / рамка

      mZFGzfzmscnEfhF
      → задняя часть корпуса
    */

    const BODY_MATERIALS = [
      "JtcYDcQFnoAKzhN_001",
      "mZFGzfzmscnEfhF"
    ];


    function hexToRGB(hex) {

      hex = hex.replace("#", "");

      return [
        parseInt(hex.substring(0, 2), 16) / 255,
        parseInt(hex.substring(2, 4), 16) / 255,
        parseInt(hex.substring(4, 6), 16) / 255,
        1
      ];

    }


    phone.addEventListener("load", () => {

      const materials = phone.model.materials;

      const bodyMaterials = materials.filter(material =>
        BODY_MATERIALS.includes(material.name)
      );


      buttons.forEach(button => {

        button.addEventListener("click", () => {

          const color = hexToRGB(button.dataset.color);


          bodyMaterials.forEach(material => {

            material.pbrMetallicRoughness
              .setBaseColorFactor(color);

          });


          buttons.forEach(b =>
            b.classList.remove("active")
          );

          button.classList.add("active");

        });

      });

    });

  </script>

</body>
</html>
