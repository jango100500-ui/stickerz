<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>iPhone 16</title>

  <script type="module"
    src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Helvetica Neue",
        sans-serif;
    }

    /* =========================
       SCENE
       ========================= */

    .scene {
      position: relative;
      width: 100%;
      height: 100%;
      background: #ffffff;
    }

    model-viewer {
      position: absolute;

      left: 50%;
      top: 50%;

      width: 100%;
      height: 78%;

      transform: translate(-50%, -50%);

      background: transparent;

      --poster-color: transparent;
    }


    /* =========================
       CENTER DOT
       ========================= */

    .center-dot {
      position: absolute;

      left: 50%;
      top: 50%;

      width: 6px;
      height: 6px;

      transform: translate(-50%, -50%);

      border-radius: 50%;

      background: rgba(0, 0, 0, 0.18);

      pointer-events: none;

      z-index: 5;
    }


    /* =========================
       COLOR PANEL
       ========================= */

    .colors {
      position: absolute;

      left: 50%;
      bottom: calc(24px + env(safe-area-inset-bottom));

      transform: translateX(-50%);

      display: flex;
      align-items: center;
      gap: 15px;

      padding: 13px 17px;

      background: rgba(245, 245, 247, 0.94);

      border: 1px solid rgba(0, 0, 0, 0.06);

      border-radius: 999px;

      box-shadow:
        0 10px 35px rgba(0, 0, 0, 0.10);

      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);

      z-index: 20;

      -webkit-tap-highlight-color: transparent;
    }


    /* =========================
       COLOR BUTTON
       ========================= */

    .color {
      appearance: none;
      -webkit-appearance: none;

      width: 28px;
      height: 28px;

      padding: 0;

      border: 2px solid #ffffff;

      border-radius: 50%;

      box-shadow:
        0 1px 5px rgba(0, 0, 0, 0.22);

      cursor: pointer;

      transition:
        transform 0.18s ease,
        box-shadow 0.18s ease;

      -webkit-tap-highlight-color: transparent;
    }

    .color:active {
      transform: scale(0.88);
    }

    .color.active {
      outline: 2px solid #111111;
      outline-offset: 3px;
    }


    /* =========================
       COLORS
       ========================= */

    .black {
      background: #171717;
    }

    .white {
      background: #eeeae2;
    }

    .blue {
      background: #9bb7d2;
    }

    .pink {
      background: #e6b5bd;
    }

    .green {
      background: #a9c2b0;
    }


    /* =========================
       SMALL SCREENS
       ========================= */

    @media (max-height: 650px) {

      model-viewer {
        height: 74%;
      }

      .colors {
        bottom: calc(16px + env(safe-area-inset-bottom));
      }

      .color {
        width: 25px;
        height: 25px;
      }

      .colors {
        gap: 13px;
        padding: 11px 15px;
      }
    }
  </style>
</head>


<body>

  <main class="scene">

    <!-- 3D MODEL -->

    <model-viewer
      id="phone"

      src="./iphone16.glb"

      camera-controls
      touch-action="pan-y"

      auto-rotate
      rotation-per-second="18deg"

      shadow-intensity="0.18"
      shadow-softness="0.8"

      exposure="1"

      camera-orbit="0deg 75deg 3.4m"
      field-of-view="32deg"

      interaction-prompt="none">
    </model-viewer>


    <!-- CENTER ORIENTATION DOT -->

    <div class="center-dot"></div>


    <!-- COLOR SELECTOR -->

    <div class="colors">

      <button
        class="color black active"
        data-color="#171717"
        aria-label="Black">
      </button>

      <button
        class="color white"
        data-color="#eeeae2"
        aria-label="White">
      </button>

      <button
        class="color blue"
        data-color="#9bb7d2"
        aria-label="Blue">
      </button>

      <button
        class="color pink"
        data-color="#e6b5bd"
        aria-label="Pink">
      </button>

      <button
        class="color green"
        data-color="#a9c2b0"
        aria-label="Green">
      </button>

    </div>

  </main>


  <script>

    const phone = document.getElementById("phone");
    const buttons = document.querySelectorAll(".color");


    /*
      Материалы корпуса из твоего GLB.

      Они меняются одновременно,
      поэтому рамка и задняя часть
      остаются одного цвета.
    */

    const BODY_MATERIALS = [
      "JtcYDcQFnoAKzhN_001",
      "mZFGzfzmscnEfhF"
    ];


    /*
      HEX → RGBA
    */

    function hexToRGBA(hex) {

      hex = hex.replace("#", "");

      return [
        parseInt(hex.substring(0, 2), 16) / 255,
        parseInt(hex.substring(2, 4), 16) / 255,
        parseInt(hex.substring(4, 6), 16) / 255,
        1
      ];

    }


    /*
      Когда GLB загрузился
    */

    phone.addEventListener("load", () => {

      const materials = phone.model.materials;


      /*
        Находим только материалы корпуса
      */

      const bodyMaterials = materials.filter(material =>
        BODY_MATERIALS.includes(material.name)
      );


      /*
        Клик по цвету
      */

      buttons.forEach(button => {

        button.addEventListener("click", () => {

          const color = hexToRGBA(
            button.dataset.color
          );


          /*
            Меняем цвет корпуса
          */

          bodyMaterials.forEach(material => {

            material.pbrMetallicRoughness
              .setBaseColorFactor(color);

          });


          /*
            Переключаем активную точку
          */

          buttons.forEach(item => {
            item.classList.remove("active");
          });

          button.classList.add("active");

        });

      });

    });

  </script>

</body>
</html>
