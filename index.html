<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>iPhone 16</title>

  <script
    type="module"
    src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
  </script>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #ffffff;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Helvetica Neue",
        sans-serif;
    }


    /* =========================
       SCENE
       ========================= */

    .scene {
      position: relative;

      width: 100%;
      height: 100%;

      background: #ffffff;
    }


    /* =========================
       IPHONE
       ========================= */

    model-viewer {
      position: absolute;

      left: 50%;
      top: 50%;

      width: 100%;
      height: 78%;

      transform: translate(-50%, -50%);

      background: transparent;

      --poster-color: transparent;
    }


    /* =========================
       CENTER DOT
       ========================= */

    .center-dot {
      position: absolute;

      left: 50%;
      top: 50%;

      width: 6px;
      height: 6px;

      transform: translate(-50%, -50%);

      border-radius: 50%;

      background: rgba(0, 0, 0, 0.18);

      pointer-events: none;

      z-index: 5;
    }


    /* =========================
       COLOR PICKER
       ========================= */

    .colors {

      position: absolute;

      left: 50%;
      bottom: calc(
        24px + env(safe-area-inset-bottom)
      );

      transform: translateX(-50%);

      display: flex;
      align-items: center;

      gap: 15px;

      padding: 13px 17px;

      background: rgba(245, 245, 247, 0.94);

      border:
        1px solid rgba(0, 0, 0, 0.06);

      border-radius: 999px;

      box-shadow:
        0 10px 35px rgba(0, 0, 0, 0.10);

      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);

      z-index: 20;

      -webkit-tap-highlight-color: transparent;
    }


    /* =========================
       COLOR BUTTON
       ========================= */

    .color {

      appearance: none;
      -webkit-appearance: none;

      width: 28px;
      height: 28px;

      padding: 0;

      border: 2px solid #ffffff;

      border-radius: 50%;

      cursor: pointer;

      box-shadow:
        0 1px 5px rgba(0, 0, 0, 0.22);

      transition:
        transform 0.18s ease,
        box-shadow 0.18s ease;

      -webkit-tap-highlight-color: transparent;
    }

    .color:active {
      transform: scale(0.88);
    }

    .color.active {
      outline: 2px solid #111111;
      outline-offset: 3px;
    }


    /* =========================
       REAL IPHONE 16 COLORS
       ========================= */

    /* Black */
    .black {
      background: #1d1d1f;
    }

    /* White */
    .white {
      background: #f5f5f0;
    }

    /* Pink */
    .pink {
      background: #e8b4bd;
    }

    /* Teal */
    .teal {
      background: #8fb5b2;
    }

    /* Ultramarine */
    .ultramarine {
      background: #5366c8;
    }


    /* =========================
       SMALL SCREENS
       ========================= */

    @media (max-height: 650px) {

      model-viewer {
        height: 74%;
      }

      .colors {
        bottom: calc(
          16px + env(safe-area-inset-bottom)
        );

        gap: 13px;

        padding: 11px 15px;
      }

      .color {
        width: 25px;
        height: 25px;
      }
    }

  </style>
</head>


<body>

  <main class="scene">


    <!-- =====================
         3D MODEL
         ===================== -->

    <model-viewer
      id="phone"

      src="./iphone16.glb"

      camera-controls

      auto-rotate
      rotation-per-second="18deg"

      shadow-intensity="0.18"
      shadow-softness="0.8"

      exposure="1"

      camera-orbit="0deg 75deg 3.4m"
      field-of-view="32deg"

      interaction-prompt="none"
    >
    </model-viewer>


    <!-- =====================
         CENTER POINT
         ===================== -->

    <div class="center-dot"></div>


    <!-- =====================
         COLOR SELECTOR
         ===================== -->

    <div class="colors">

      <button
        class="color black active"
        data-color="#1d1d1f"
        aria-label="Black">
      </button>

      <button
        class="color white"
        data-color="#f5f5f0"
        aria-label="White">
      </button>

      <button
        class="color pink"
        data-color="#e8b4bd"
        aria-label="Pink">
      </button>

      <button
        class="color teal"
        data-color="#8fb5b2"
        aria-label="Teal">
      </button>

      <button
        class="color ultramarine"
        data-color="#5366c8"
        aria-label="Ultramarine">
      </button>

    </div>

  </main>


  <script>

    const phone =
      document.getElementById("phone");

    const buttons =
      document.querySelectorAll(".color");


    /*
     * =====================================
     * MATERIALS FROM YOUR iphone16.glb
     * =====================================
     *
     *  iUpcKVJxvpQRARa
     *  → rear glass / back panel
     *
     *  JtcYDcQFnoAKzhN_001
     *  → aluminum frame
     *
     * These two are changed together.
     */


    const BODY_MATERIALS = [

      "iUpcKVJxvpQRARa",

      "JtcYDcQFnoAKzhN_001"

    ];


    /*
     * =====================================
     * HEX → RGBA
     * =====================================
     */

    function hexToRGBA(hex) {

      hex = hex.replace("#", "");

      return [

        parseInt(
          hex.substring(0, 2),
          16
        ) / 255,

        parseInt(
          hex.substring(2, 4),
          16
        ) / 255,

        parseInt(
          hex.substring(4, 6),
          16
        ) / 255,

        1

      ];

    }


    /*
     * =====================================
     * MODEL LOADED
     * =====================================
     */

    phone.addEventListener(
      "load",
      () => {

        const materials =
          phone.model.materials;


        /*
         * Find the actual materials
         * inside the GLB.
         */

        const bodyMaterials =
          materials.filter(
            material =>
              BODY_MATERIALS.includes(
                material.name
              )
          );


        /*
         * =================================
         * COLOR BUTTONS
         * =================================
         */

        buttons.forEach(button => {

          button.addEventListener(
            "click",
            () => {

              const color =
                hexToRGBA(
                  button.dataset.color
                );


              /*
               * Change rear glass
               * + aluminum frame.
               */

              bodyMaterials.forEach(
                material => {

                  material
                    .pbrMetallicRoughness
                    .setBaseColorFactor(
                      color
                    );

                }
              );


              /*
               * Active indicator
               */

              buttons.forEach(
                item =>
                  item.classList.remove(
                    "active"
                  )
              );


              button.classList.add(
                "active"
              );

            }
          );

        });

      }
    );

  </script>

</body>
</html>
